# Runs the RaceDay MVC web app in a container.
# The Part 2 API runs on your machine (dotnet run) and the container reaches it
# through host.docker.internal.
#
#   1. Terminal A:  dotnet run --project RaceDay.Api --urls http://0.0.0.0:5000
#   2. Terminal B:  docker compose up --build
#   3. Browse to    http://localhost:8080
services:
  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    image: raceday-web
    ports:
      - "8080:8080"
    environment:
      ApiBaseUrl: "http://host.docker.internal:5000/"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Windows/Mac
    restart: unless-stopped
