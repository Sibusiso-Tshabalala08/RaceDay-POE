name: Validate Repo Structure

# Runs automatically whenever code is pushed, or a pull request is opened,
# against the main branch. This gives you an automatic pass/fail check
# every time you commit, without doing anything manually.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-docs-structure:
    name: Check /docs folder and required Part 1 files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "OK: /docs folder found."

      - name: Verify ERD file exists
        run: |
          if [ ! -f "docs/RaceDay_ERD.png" ] && [ ! -f "docs/RaceDay_ERD.pdf" ]; then
            echo "ERROR: ERD file (RaceDay_ERD.png or .pdf) is missing from /docs."
            exit 1
          fi
          echo "OK: ERD file found."

      - name: Verify API Endpoint Plan exists
        run: |
          if [ ! -f "docs/RaceDay_API_Endpoint_Plan.md" ] && [ ! -f "docs/RaceDay_API_Endpoint_Plan.pdf" ]; then
            echo "ERROR: API Endpoint Plan (RaceDay_API_Endpoint_Plan.md or .pdf) is missing from /docs."
            exit 1
          fi
          echo "OK: API Endpoint Plan found."

      - name: Verify SQL script exists
        run: |
          if [ ! -f "docs/RaceDay_Database.sql" ]; then
            echo "ERROR: SQL script (RaceDay_Database.sql) is missing from /docs."
            exit 1
          fi
          echo "OK: SQL script found."

      - name: Verify README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "OK: README.md found."

      - name: All required files present
        run: echo "SUCCESS - Repository structure meets Part 1 requirements."
