name: Build and Test (API + MVC + Docker)

# Runs on every push and pull request to main and to any part-3 branch.
# A green run means: the whole solution (API, tests AND the MVC web app)
# builds, all unit tests pass, and the MVC Docker image builds and starts.
on:
  push:
    branches: [ "main", "part-3*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build solution and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution (API, tests and MVC web app)
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish MVC web app
        run: dotnet publish RaceDay.Web/RaceDay.Web.csproj --no-build --configuration Release --output web-publish

      - name: All build and test checks passed
        run: echo "SUCCESS - API and MVC build, all tests pass."

  docker-build:
    name: Build and smoke-test the MVC Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f RaceDay.Web/Dockerfile -t raceday-web .

      - name: Start the container
        run: docker run -d --name raceday-web -p 8080:8080 -e ApiBaseUrl=http://localhost:9/ raceday-web

      - name: Check the site answers on port 8080
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "The MVC container is up and serving pages."
              exit 0
            fi
            sleep 2
          done
          echo "The container did not start in time. Logs follow."
          docker logs raceday-web
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs raceday-web
